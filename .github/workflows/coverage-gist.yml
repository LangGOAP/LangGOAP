name: Update Badges

on:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra checkpoint-postgres --extra checkpoint-redis

      # MFCQI runs before the test suite so a failing test never leaves a
      # stale quality number on the README. The message and colour are taken
      # from mfcqi's own badge generator, so the README shows exactly what
      # ``mfcqi badge langgoap`` prints locally.
      - name: Compute MFCQI badge
        id: mfcqi
        run: |
          uv run python -m mfcqi badge langgoap -f json -o mfcqi-badge.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          badge = json.load(open("mfcqi-badge.json"))
          print(f"message={badge['message']}")
          print(f"color={badge['color']}")
          PY

      - name: Create MFCQI Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: langgoap-mfcqi.json
          label: MFCQI
          message: ${{ steps.mfcqi.outputs.message }}
          color: ${{ steps.mfcqi.outputs.color }}

      - name: Run tests with coverage
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            uv run pytest --cov=langgoap --cov-report=term --cov-report=json
          else
            uv run pytest -m "not api" --cov=langgoap --cov-report=term --cov-report=json
          fi
          COVERAGE=$(python3 -c "import json; print(int(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV

          # Same floor as the PR quality gate (80%).
          if [ $COVERAGE -lt 80 ]; then
            echo "COLOR=red" >> $GITHUB_ENV
          elif [ $COVERAGE -lt 90 ]; then
            echo "COLOR=yellow" >> $GITHUB_ENV
          else
            echo "COLOR=green" >> $GITHUB_ENV
          fi

      - name: Create Coverage Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: langgoap-coverage.json
          label: Coverage
          message: ${{ env.COVERAGE }}%
          color: ${{ env.COLOR }}
