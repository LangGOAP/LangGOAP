name: Test Release to Test PyPI

on:
  workflow_call:
    outputs:
      version:
        description: "Package version"
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.check-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install build dependencies
        run: uv pip install --system build twine tomli

      # Keep build *separate* from publish so trusted-publish / token creds
      # never reach the build step. Per PyPA guidance:
      # https://github.com/pypa/gh-action-pypi-publish#non-goals
      - name: Build project for distribution
        run: python -m build

      - name: Check built package
        run: python -m twine check dist/*

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: test-dist
          path: dist/

      - name: Check Version
        id: check-version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("langgoap/_version.py").read_text(encoding="utf-8")
          print(re.search(r"__version__\s*=\s*['\"]([^'\"]+)['\"]", text).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

  publish-test-pypi:
    needs:
      - build
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: test-dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          verbose: true
          print-hash: true
          # Overwrite duplicate artifacts. Safe *only* on Test PyPI.
          # https://github.com/pypa/gh-action-pypi-publish#tolerating-release-package-file-duplicates
          skip-existing: true
          attestations: false

  validate-test-pypi:
    needs:
      - build
      - publish-test-pypi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      # No caching here — we want maximal sensitivity to dependency-spec gaps.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Upgrade setuptools with UV
        run: uv pip install --system "setuptools>=40.8.0" wheel

      - name: Wait for Test PyPI to list the version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # The simple index takes a while to list a fresh upload; asking for it
        # sooner fails with "no version of langgoap==VERSION" (#111).
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS https://test.pypi.org/simple/langgoap/ | grep -q "langgoap-$VERSION"; then
              echo "✅ Test PyPI lists langgoap==$VERSION (attempt $attempt)"
              exit 0
            fi
            echo "⏳ Not listed yet (attempt $attempt of 30); waiting 10s..."
            sleep 10
          done
          echo "❌ Test PyPI did not list langgoap==$VERSION within 5 minutes"
          exit 1

      - name: Install from Test PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # Regular PyPI = primary index (deps resolved here);
        # Test PyPI = extra index so the not-yet-on-PyPI langgoap==VERSION
        # can be found. unsafe-best-match lets UV pull deps from either.
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt of 5..."
            if uv pip install --system \
              --index-strategy unsafe-best-match \
              --extra-index-url https://test.pypi.org/simple/ \
              "langgoap==$VERSION"; then
              echo "✅ Successfully installed langgoap==$VERSION"
              exit 0
            fi

            if [ $attempt -lt 5 ]; then
              delay=$((attempt * 15))
              echo "⏳ Install failed, waiting ${delay}s before retry..."
              sleep $delay
            fi
          done

          echo "❌ Failed to install after 5 attempts"
          exit 1

      - name: Verify package import
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -c "import langgoap; print(f'langgoap version: {langgoap.__version__}')"
          echo "✅ Package import successful"

      - name: Verify CLI works
        run: |
          langgoap --version
          echo "✅ CLI executable works"

      - name: Run the test suite against the published wheel
        env:
          OPENAI_API_KEY: ""
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A throwaway venv holds ONLY the published wheel plus the test
          # tooling.  ``uv sync`` would install the checkout as editable and
          # ``uv run`` would test that instead of the artifact.
          uv venv /tmp/wheel-venv --python ${{ matrix.python-version }}
          uv export --only-group dev --no-hashes --no-emit-project --no-emit-workspace \
            -o /tmp/dev-requirements.txt
          uv pip install --python /tmp/wheel-venv/bin/python -r /tmp/dev-requirements.txt
          uv pip install --python /tmp/wheel-venv/bin/python \
            --index-strategy unsafe-best-match \
            --extra-index-url https://test.pypi.org/simple/ \
            "langgoap[checkpoint-postgres,checkpoint-redis]==$VERSION"
          # The checkout's own package directory must not shadow the wheel.
          mv langgoap /tmp/langgoap-source-moved-aside
          /tmp/wheel-venv/bin/python -c "import langgoap, pathlib; p = pathlib.Path(langgoap.__file__); assert 'site-packages' in p.parts, p; print('testing', p)"
          /tmp/wheel-venv/bin/python -m pytest tests/test_state.py tests/test_goals.py tests/test_actions.py tests/test_json_native_state.py -v -p no:cacheprovider
          mv /tmp/langgoap-source-moved-aside langgoap

      - name: Install dev tooling for self-analysis
        run: uv sync --dev

      - name: Verify MFCQI can analyze published package
        run: |
          uv run python -m mfcqi analyze langgoap --format json --silent > /tmp/mfcqi.json
          python -c "import json; data = json.load(open('/tmp/mfcqi.json')); print(f\"MFCQI Score: {data['mfcqi_score']}\")"
          echo "✅ Self-analysis works"

