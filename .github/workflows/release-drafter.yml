name: Release Drafter

on:
  push:
    branches:
      - main
  # The autolabeler only sees pull requests; pull_request_target keeps the
  # write token for forks while running the action from the base branch.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions: {}
jobs:
  update_release_draft:
    permissions:
      pull-requests: write
      contents: write

    runs-on: ubuntu-latest
    steps:
      # The draft is updated on pushes to main.
      - uses: release-drafter/release-drafter@v7
        if: github.event_name == 'push'
        with:
          config-name: release-drafter-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # From release-drafter v7 the autolabeler is its own action; it reads the
      # same config and labels pull requests from their titles.
      - uses: release-drafter/release-drafter/autolabeler@v7
        if: github.event_name == 'pull_request_target'
        with:
          config-name: release-drafter-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
