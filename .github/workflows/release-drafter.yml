name: Release Drafter

on:
  push:
    branches:
      - main
  # The autolabeler only sees pull requests; pull_request_target keeps the
  # write token for forks while running the action from the base branch.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions: {}
jobs:
  update_release_draft:
    permissions:
      pull-requests: write
      contents: write

    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
