name: Deploy Documentation

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group docs --extra checkpoint-postgres --extra checkpoint-redis

      - name: Build versioned documentation
        run: |
          set -e
          OUTPUT_DIR="$GITHUB_WORKSPACE/docs/_build/html"
          mkdir -p "$OUTPUT_DIR"

          TAG_REGEX='^v0\.1\.([1-9][0-9]*)$|^v0\.([2-9]|[0-9]{2,})\.[0-9]+$|^v[1-9][0-9]*\.[0-9]+\.[0-9]+$'

          TAGS=$(git tag --sort=-v:refname | grep -E "$TAG_REGEX" || true)
          VERSIONS_JSON='[]'
          LATEST_TAG=""

          # Each tag is built from its own worktree with its own virtualenv,
          # so autodoc documents that release's code rather than main's and
          # tag-only files never leak into the main build (issue #60).
          for tag in $TAGS; do
            echo "=== Building docs for tag: $tag ==="
            if ! git ls-tree --name-only "$tag" -- docs/ > /dev/null 2>&1; then
              echo "    Skipping $tag (no docs/ directory)"
              continue
            fi
            WORKTREE="$(mktemp -d)"
            git worktree add --detach "$WORKTREE" "$tag"
            (
              cd "$WORKTREE"
              if grep -q '^docs = \[' pyproject.toml; then
                uv sync --group docs
              else
                uv sync && uv pip install -r docs/requirements.txt
              fi
              uv run python docs/copy_notebooks.py || true
              # Older tags predate the generator; their committed page is used as is.
              [ -f docs/generate_api_index.py ] && uv run python docs/generate_api_index.py || true
              uv run sphinx-build -b html docs "$OUTPUT_DIR/$tag"
            )
            git worktree remove --force "$WORKTREE"

            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="$tag"
            fi
            VERSIONS_JSON=$(echo "$VERSIONS_JSON" | python3 -c "
          import json, sys
          v = json.load(sys.stdin)
          v.append({'name': '$tag', 'tag': True})
          print(json.dumps(v))")
          done

          echo "=== Building docs for main ==="
          uv run --group docs python docs/copy_notebooks.py
          uv run --group docs python docs/generate_api_index.py
          uv run --group docs sphinx-build -b html docs "$OUTPUT_DIR/main"

          VERSIONS_JSON=$(echo "$VERSIONS_JSON" | python3 -c "
          import json, sys
          v = json.load(sys.stdin)
          v.append({'name': 'main', 'tag': False})
          print(json.dumps(v))")

          TARGET="${LATEST_TAG:-main}"

          python3 -c "
          import json
          versions = json.loads('$VERSIONS_JSON')
          data = {'versions': versions, 'latest': '${LATEST_TAG}', 'current': ''}
          with open('$OUTPUT_DIR/versions.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          for dir in "$OUTPUT_DIR"/*/; do
            name=$(basename "$dir")
            cp "$OUTPUT_DIR/versions.json" "$dir/versions.json"
            python3 -c "
          import json
          with open('$dir/versions.json') as f:
              data = json.load(f)
          data['current'] = '$name'
          with open('$dir/versions.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          done

          cat > "$OUTPUT_DIR/index.html" << REDIRECT_EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <meta http-equiv="refresh" content="0; url=${TARGET}/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="${TARGET}/index.html">latest documentation</a>...</p>
          </body>
          </html>
          REDIRECT_EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
