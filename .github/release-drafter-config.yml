name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Pre-1.0 policy: a breaking change bumps the minor version, features too;
# everything else is a patch.  Revisit when 1.0 ships.
version-resolver:
  minor:
    labels:
      - 'breakingchange'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'bugfix'
      - 'fix'
      - 'BUG'
      - 'maintenance'
  default: patch
# Each title rule fires for exactly one conventional-commit shape, so a
# pull request lands under one heading: a ``!`` (breaking) title gets only
# ``breakingchange``, and no rule is keyed on changed files (a ``*.md``
# rule used to mark every docs PR as maintenance as well).
autolabeler:
  - label: 'breakingchange'
    title:
      - '/^[a-z]+(\([^)]+\))?!:/i'
      - '/BREAKING[ -]CHANGE/'
  - label: 'enhancement'
    title:
      - '/^feat(\([^)]+\))?:/i'
  - label: 'bug'
    title:
      - '/^fix(\([^)]+\))?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\([^)]+\))?:/i'
  - label: 'maintenance'
    title:
      - '/^(chore|ci|build|style|refactor|test|perf|release)(\([^)]+\))?:/i'
categories:
  - title: 'Breaking Changes'
    labels:
      - 'breakingchange'
  - title: '🧪 Experimental Features'
    labels:
      - 'experimental'
  - title: '🚀 New Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'BUG'
  - title: '📚 Documentation'
    label: 'documentation'
  - title: '🧰 Maintenance'
    label: 'maintenance'
change-template: '- $TITLE (#$NUMBER)'
exclude-labels:
  - 'skip-changelog'
template: |
  # Changes

  $CHANGES

  ## Contributors
  We'd like to thank all the contributors who worked on this release!

  $CONTRIBUTORS
