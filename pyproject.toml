[project]
name = "langgoap"
version = "0.1.0"
description = "Goal-Oriented Action Planning framework for LangGraph with constraint optimization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Brian Sam-Bodden", email = "bsb@integrallis.com" },
    { name = "Integrallis Software", email = "info@integrallis.com" },
]
keywords = ["ai", "goap", "planning", "agents", "langgraph", "langchain", "constraint-satisfaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint>=4.0.0,<5.0.0",
    "ortools>=9.8",
]

[project.optional-dependencies]
checkpoint-postgres = ["langgraph-checkpoint-postgres>=3.0.0,<4.0.0"]
checkpoint-redis = ["langgraph-checkpoint-redis>=0.4.0,<1.0.0"]

[project.urls]
Homepage = "https://github.com/integrallis/langgoap"
Documentation = "https://integrallis.github.io/langgoap"
Repository = "https://github.com/integrallis/langgoap"
Issues = "https://github.com/integrallis/langgoap/issues"
Changelog = "https://github.com/integrallis/langgoap/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langgoap"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1.0",
    "pytest-xdist[psutil]>=3.8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=6.2",
    "testcontainers>=4.12.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.11.0,<2",
    "coverage>=7.10",
    "vulture>=2.14",
    "langchain-openai>=0.3",
    "ipykernel>=7.2.0",
    "langchain-anthropic>=1.4.0",
    "pytest-benchmark>=5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# examples/tutorials is added so tests can import tutorial_examples.*
# (the same import path notebooks use when running from that directory).
pythonpath = [".", "examples/tutorials"]
addopts = "--strict-markers --strict-config --durations=5 -vv --ignore=tests/benchmarks"
asyncio_mode = "auto"
markers = [
    "api: marks tests that call real LLM APIs (deselect with '-m not api')",
    "bench: marks benchmark tests — run with 'make benchmark' (ignored by default test suite)",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.core.waiting_utils",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langchain_core",
]

[tool.black]
target-version = ['py310', 'py312']
exclude = '''
(
  | \.egg
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | build
  | dist
  | setup.py
)
'''

[tool.mypy]
disallow_untyped_defs = true
explicit_package_bases = true
warn_no_return = true
warn_unused_ignores = true
warn_redundant_casts = true
allow_redefinition = true
ignore_missing_imports = true
# typeddict-item: suppressed because GoapState uses total=False (all keys optional)
# — accessing optional keys with .get() rather than direct indexing is deliberate.
disable_error_code = "typeddict-item"

[tool.coverage.run]
source = ["langgoap"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/scripts.py",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.vulture]
paths = ["langgoap"]
exclude = ["*test*", "*example*"]
min_confidence = 80
sort_by_size = true

[tool.isort]
profile = "black"
