name: langgoap-notebooks
services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jupyter/workspace/examples
      - ../:/home/jupyter/workspace/langgoap
    env_file:
      # Optional: copy ../.env.example to ../.env to pass API keys through.
      - path: ../.env
        required: false
    environment:
      - USER_AGENT=LangGOAPJupyterNotebooks
    user: jupyter
    working_dir: /home/jupyter/workspace/examples
